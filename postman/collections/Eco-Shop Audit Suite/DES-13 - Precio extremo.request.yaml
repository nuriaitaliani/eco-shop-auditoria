$kind: http-request
url: http://127.0.0.1:5000/api/discount
method: POST
body:
  type: json
  content: |-
    {
      "price": 1e100,
      "coupon": "ECO20"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"HTTP 400 para precio extremo\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"La respuesta JSON indica un error\", function () {\r

      \    const datos = pm.response.json();\r

      \    pm.expect(datos.status).to.eql(\"error\");\r

      });\r

      \r

      pm.test(\"El mensaje identifica el campo price\", function () {\r

      \    const datos = pm.response.json();\r

      \    pm.expect(datos.error).to.be.a(\"string\");\r

      \    pm.expect(datos.error.toLowerCase()).to.include(\"price\");\r

      });"
    language: text/javascript
order: 4000
